<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SJX AI</title>
<style>
:root{--bg:#0b0b12;--card:#15151f;--line:#2a2a3a;--tx:#f1f1f8;--mu:#9a9ab0;--ac:#8b5cf6;--ac2:#6d28d9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 14px) 16px 80px;max-width:640px;margin:auto}
h1{margin:6px 0 0;font-size:34px;color:var(--ac)}.sub{color:var(--mu);margin:2px 0 16px}
.tabs,.seg{display:flex;gap:8px;margin-bottom:14px}
.tabs button,.seg button{flex:1;padding:13px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px}
.tabs button.on,.seg button.on{border-color:var(--ac);background:#1e1838;color:#c9b6ff}
label{display:block;color:var(--mu);margin:12px 0 6px;font-size:14px}
textarea,select,input{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:130px;resize:vertical}.row{display:flex;gap:10px}.row>div{flex:1}
.big{width:100%;margin-top:16px;padding:15px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font-size:17px;font-weight:600}
.big:disabled{opacity:.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ch b{color:#c9b6ff;letter-spacing:.5px}.txt{white-space:pre-wrap;line-height:1.55}
.mini{display:flex;gap:6px;margin-top:10px}.mini button,.grid button{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:#1b1b29;color:var(--tx);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.grid button{padding:13px 4px;font-size:14px}
.st{color:var(--mu);font-size:14px;margin-top:10px;min-height:20px}.err{color:#ff6b6b}
.meta{color:var(--mu);font-size:14px;line-height:1.6}.meta b{color:var(--tx)}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#2b2b40;padding:11px 18px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}.hide{display:none}
.hi{display:flex;justify-content:space-between;gap:8px;align-items:center}.hi small{color:var(--mu)}
</style></head><body>
<h1>SJX AI</h1><div class="sub">Create Smarter. Grow Faster.</div>
<div class="tabs"><button id="tS" class="on">Script</button><button id="tH">History</button><button id="tK">API Key</button></div>

<div id="vS">
 <div class="seg"><button id="mT" class="on">Enter Your Topic</button><button id="mP">Paste Your Script</button></div>
 <textarea id="inp" placeholder="Enter your topic or idea here..."></textarea>
 <div class="row"><div><label>Category</label><select id="cat"></select></div><div><label>Duration</label><select id="dur"></select></div></div>
 <label>Script language</label>
 <select id="lang"><option>Hinglish</option><option>Hindi</option><option>English</option></select>
 <button class="big" id="gen">Generate Script</button>
 <div class="st" id="st"></div>
 <div id="res"></div>
</div>

<div id="vH" class="hide"></div>

<div id="vK" class="hide">
 <div class="card"><b>GEMINI API KEY (FREE)</b>
 <label>aistudio.google.com/apikey se free key lo</label>
 <input id="key" type="password" placeholder="Paste API key here">
 <button class="big" id="saveKey">Save Key</button>
 <div class="st">Key sirf is phone me rehti hai.</div></div>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),LS=localStorage,sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SEC=[['hook','HOOK','🎣',.1],['problem','PROBLEM','⚠️',.2],['solution','SOLUTION','💡',.4],['result','RESULT','🏆',.2],['cta','CTA','📣',.1]];
const DUR=[[15,'15 Seconds'],[30,'30 Seconds'],[60,'60 Seconds'],...[2,3,4,5,6,7,8,9,10].map(m=>[m*60,m+' Minutes'])];
const CAT=['Motivation','Education','Business','Finance','Health & Fitness','Tech','Storytelling','Comedy','Spiritual','Relationship'];
const MODELS=['gemini-2.5-flash','gemini-2.0-flash','gemini-2.5-flash-lite'];
let mode='topic',cur=null,editing=null;
$('#cat').innerHTML=CAT.map(c=>`<option>${c}</option>`).join('');
$('#dur').innerHTML=DUR.map(d=>`<option value="${d[0]}"${d[0]==30?' selected':''}>${d[1]}</option>`).join('');
$('#key').placeholder=LS.sjx_key?'Key saved (paste again to change)':'Paste API key here';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
function tab(n){['S','H','K'].forEach(x=>{$('#v'+x).classList.toggle('hide',x!=n);$('#t'+x).classList.toggle('on',x==n)});if(n=='H')hist()}
$('#tS').onclick=()=>tab('S');$('#tH').onclick=()=>tab('H');$('#tK').onclick=()=>tab('K');
function setMode(m){mode=m;$('#mT').classList.toggle('on',m=='topic');$('#mP').classList.toggle('on',m=='script');
 $('#inp').placeholder=m=='topic'?'Enter your topic or idea here...':'Paste your existing script here...'}
$('#mT').onclick=()=>setMode('topic');$('#mP').onclick=()=>setMode('script');
$('#saveKey').onclick=()=>{const v=$('#key').value.trim();if(!v)return toast('Key paste karo');LS.sjx_key=v;$('#key').value='';$('#key').placeholder='Key saved (paste again to change)';toast('Key saved ✅');tab('S')};

async function ai(p,st){
 const key=LS.sjx_key;let err='';
 for(const m of MODELS){for(let t=0;t<2;t++){
  st&&st(`⏳ ${m} (try ${t+1})...`);
  const gc={temperature:.9,maxOutputTokens:8192,responseMimeType:'application/json'};
  if(m.includes('2.5'))gc.thinkingConfig={thinkingBudget:0};
  let r;try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:p}]}],generationConfig:gc})})}catch(e){err='Internet check karo';await sleep(1200);continue}
  if(r.ok){const d=await r.json();const tx=(d.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('');
   try{return JSON.parse(tx.replace(/^\s*```json|```\s*$/g,'').trim())}catch(e){err='Bad response';continue}}
  const e=await r.json().catch(()=>({}));err=e.error?.message||('code '+r.status);
  if([400,401,403].includes(r.status)&&/key/i.test(err))throw new Error('API key galat hai. API Key tab me nayi key daalo.');
  if(r.status==404||r.status==400)break;
  await sleep(1500*(t+1));
 }}
 throw new Error('Server busy. Thodi der baad Generate dubara dabao. ('+err.slice(0,80)+')');
}
const words=(k,d)=>Math.round(d*2.5*SEC.find(s=>s[0]==k)[3]);
function base(c){
 const w=Math.round(c.dur*2.5),lim=SEC.map(s=>`${s[1]} ~${Math.round(w*s[3])} words`).join(', ');
 const lang=c.lang=='Hinglish'?'Hinglish (Hindi written in Roman/English letters mixed naturally with English, like everyday Indian creators speak)':c.lang;
 const task=c.mode=='topic'?`MODE: TOPIC TO SCRIPT.\nTopic/idea: """${c.input}"""\nUnderstand the topic deeply and write a complete original script specific to it.`
 :`MODE: EXISTING SCRIPT TO FIVE-STEP FORMAT.\nOriginal script: """${c.input}"""\nIdentify its main message, extract important facts/details, reorganize into the five sections, rewrite weak sentences, improve storytelling and the opening hook, make dialogue natural. PRESERVE original meaning and important details; do not change the creator's message. Expand or trim to fit the duration.`;
 return `You are a professional short-video and long-video scriptwriter.\n${task}\nCategory: ${c.cat}\nLanguage: ${lang}\nTarget duration: ${c.dur>=60?c.dur/60+' minutes':c.dur+' seconds'} spoken at ~150 words/minute = about ${w} words TOTAL. Word budget: ${lim}. Follow this length strictly.\nFormula is mandatory: HOOK, PROBLEM, SOLUTION, RESULT, CTA. Spoken voiceover text only, no stage directions inside the sections.`}
async function generate(){
 const input=$('#inp').value.trim();
 if(!input)return toast(mode=='topic'?'Topic likho':'Script paste karo');
 if(!LS.sjx_key){toast('Pehle API key save karo');return tab('K')}
 const c={input,mode,cat:$('#cat').value,dur:+$('#dur').value,lang:$('#lang').value};
 const b=$('#gen');b.disabled=true;b.textContent='Generating...';$('#st').className='st';
 try{
  const j=await ai(base(c)+`\nReturn ONLY JSON: {"hook":"","problem":"","solution":"","result":"","cta":"","tone":"emotional tone in one line","delivery":"voiceover delivery suggestions (pace, energy, emphasis)","pauses":["where and how long to pause, e.g. After hook: 1 sec"],"overlays":["SECTION: short on-screen text"]}`,t=>$('#st').textContent=t);
  c.secs={};SEC.forEach(s=>c.secs[s[0]]=j[s[0]]||'');
  if(!c.secs.hook||!c.secs.cta)throw new Error('Incomplete output, dubara try karo');
  c.tone=j.tone||'';c.delivery=j.delivery||'';c.pauses=[].concat(j.pauses||[]);c.overlays=[].concat(j.overlays||[]);
  cur=c;editing=null;$('#st').textContent='';render();$('#res').scrollIntoView({behavior:'smooth'});
 }catch(e){$('#st').className='st err';$('#st').textContent='Error: '+e.message}
 b.disabled=false;b.textContent='Generate Script';
}
$('#gen').onclick=generate;
const combined=c=>SEC.map(s=>c.secs[s[0]]).join('\n\n');
function fmt(s){return s>=60?Math.floor(s/60)+' min '+(s%60)+' sec':s+' sec'}
function full(c){const wc=combined(c).split(/\s+/).filter(Boolean).length;
 return `SJX AI SCRIPT\nTopic/Input: ${c.input.slice(0,120)}\nCategory: ${c.cat} | Language: ${c.lang} | Target: ${fmt(c.dur)}\n\n`+
 SEC.map(s=>`${s[1]}\n${c.secs[s[0]]}`).join('\n\n')+`\n\nCOMPLETE VOICEOVER\n${combined(c)}\n\nEstimated Speaking Duration: ${fmt(Math.round(wc/2.5))} (${wc} words)\nEmotional Tone: ${c.tone}\nDelivery: ${c.delivery}\nPauses:\n- ${c.pauses.join('\n- ')}\nText Overlays:\n- ${c.overlays.join('\n- ')}\n`}
function render(){
 const c=cur,R=$('#res');if(!c){R.innerHTML='';return}
 const wc=combined(c).split(/\s+/).filter(Boolean).length;
 R.innerHTML=SEC.map(s=>{const k=s[0];return `<div class="card"><div class="ch"><b>${s[2]} ${s[1]}</b></div>
 ${editing==k?`<textarea id="ed">${esc(c.secs[k])}</textarea>`:`<div class="txt">${esc(c.secs[k])}</div>`}
 <div class="mini"><button data-a="edit" data-k="${k}">${editing==k?'Done':'✏️ Edit'}</button><button data-a="copy" data-k="${k}">📋 Copy</button><button data-a="regen" data-k="${k}">🔄 Regenerate</button></div></div>`}).join('')+
 `<div class="card"><div class="ch"><b>🎙️ COMPLETE VOICEOVER</b></div><div class="txt">${esc(combined(c))}</div></div>
 <div class="card meta"><b>⏱ Estimated Speaking Duration:</b> ${fmt(Math.round(wc/2.5))} (${wc} words)<br><b>🎭 Emotional Tone:</b> ${esc(c.tone)}<br><b>🗣 Delivery:</b> ${esc(c.delivery)}<br><b>⏸ Important Pauses:</b><br>${c.pauses.map(p=>'• '+esc(p)).join('<br>')}<br><b>🔤 Text Overlays:</b><br>${c.overlays.map(p=>'• '+esc(p)).join('<br>')}</div>
 <div class="grid"><button data-a="copyAll">📋 Copy Complete Script</button><button data-a="regenAll">🔄 Regenerate Complete</button><button data-a="save">💾 Save Script</button><button data-a="txt">⬇️ Download TXT</button><button data-a="pdf" style="grid-column:span 2">📄 Download PDF</button></div>`;
}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Copied ✅')}
async function regen(k){
 cur.secs[k]=cur.secs[k];const c=cur;
 try{const j=await ai(base(c)+`\nCurrent full script:\n${combined(c)}\n\nRewrite ONLY the ${k.toUpperCase()} section with a fresh, better version (~${words(k,c.dur)} words) that still flows with the other sections. Return ONLY JSON: {"text":""}`);
 if(!j.text)throw new Error('Empty');c.secs[k]=j.text}catch(e){toast(e.message)}
 render()}
async function out(name,data,b64){
 const C=window.Capacitor;
 if(C&&C.isNativePlatform&&C.isNativePlatform()){
  const {Filesystem,Share}=C.Plugins;
  const r=await Filesystem.writeFile(b64?{path:name,data,directory:'CACHE'}:{path:name,data,directory:'CACHE',encoding:'utf8'});
  await Share.share({title:name,url:r.uri,dialogTitle:'Save / Share '+name});
 }else{const a=document.createElement('a');a.href=b64?'data:application/pdf;base64,'+data:URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download=name;a.click()}
}
function makePdf(c){
 const {jsPDF}=window.jspdf,d=new jsPDF(),W=180;let y=15;
 d.setFontSize(16);d.text('SJX AI Script',15,y);y+=10;d.setFontSize(11);
 for(const ln of d.splitTextToSize(full(c).replace('SJX AI SCRIPT\n',''),W)){if(y>280){d.addPage();y=15}d.text(ln,15,y);y+=6}
 return d.output('datauristring').split(',')[1]}
function hist(){
 const h=JSON.parse(LS.sjx_hist||'[]');
 $('#vH').innerHTML=h.length?h.map((x,i)=>`<div class="card hi"><div><b>${esc(x.input.slice(0,40))}</b><br><small>${x.cat} • ${fmt(x.dur)} • ${new Date(x.t).toLocaleDateString()}</small></div><div class="mini" style="margin:0"><button data-o="${i}">Open</button><button data-d="${i}">🗑</button></div></div>`).join(''):'<div class="sub">Abhi koi saved script nahi.</div>'}
$('#vH').onclick=e=>{const b=e.target.closest('button');if(!b)return;const h=JSON.parse(LS.sjx_hist||'[]');
 if(b.dataset.o!=null){cur=h[b.dataset.o];editing=null;tab('S');render()}
 if(b.dataset.d!=null){h.splice(b.dataset.d,1);LS.sjx_hist=JSON.stringify(h);hist()}};
$('#res').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,k=b.dataset.k;
 try{
 if(a=='edit'){if(editing==k){cur.secs[k]=$('#ed').value}editing=editing==k?null:k;render()}
 else if(a=='copy')copy(cur.secs[k]);
 else if(a=='regen'){b.disabled=true;b.textContent='...';regen(k)}
 else if(a=='copyAll')copy(full(cur));
 else if(a=='regenAll')generate();
 else if(a=='save'){const h=JSON.parse(LS.sjx_hist||'[]');h.unshift({...cur,t:Date.now()});LS.sjx_hist=JSON.stringify(h.slice(0,50));toast('Saved 💾')}
 else if(a=='txt')await out('SJX-script.txt',full(cur),false);
 else if(a=='pdf')await out('SJX-script.pdf',makePdf(cur),true);
 }catch(err){toast('Error: '+err.message)}};
</script>
<script src="jspdf.umd.min.js"></script>
</body></html>
